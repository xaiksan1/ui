<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ADAM Circuit Breaker</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            color: #ffd700;
            font-family: 'Courier New', Courier, monospace;
        }
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 0 0 10px #ffd700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 100px;
            height: 100vh;
            box-sizing: border-box;
        }
        .breaker {
            border: 2px solid #ffd700;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 215, 0, 0.05);
            transition: all 0.3s;
        }
        .breaker.tripped {
            border-color: #ff0000;
            color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
            box-shadow: 0 0 20px #ff0000;
        }
        .switch {
            width: 40px;
            height: 80px;
            background: #333;
            position: relative;
            cursor: pointer;
        }
        .handle {
            width: 100%;
            height: 50%;
            background: #ffd700;
            position: absolute;
            top: 0;
            transition: top 0.2s;
        }
        .tripped .handle {
            top: 50%;
            background: #ff0000;
        }
        .label {
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>CIRCUIT_BREAKER_v6.4</h1>
        <p>SYSTEM_INTEGRITY: NOMINAL</p>
    </div>
    <div class="grid" id="grid">
        <!-- Breakers will be added here -->
    </div>

    <script>
        const grid = document.getElementById('grid');
        const modules = [
            'NEURAL_CORE', 'MEMORY_SYNC', 'API_GATEWAY', 'SECURITY_SHIELD',
            'DATA_HIVE', 'QUANTUM_LINK', 'BIO_SENSOR', 'VOID_TERMINAL',
            'CRYPTO_VAULT', 'STREAM_PROC', 'LOGIC_ENGINE', 'UPLINK_SAT'
        ];

        function init() {
            modules.forEach(mod => {
                const breaker = document.createElement('div');
                breaker.className = 'breaker';
                breaker.id = mod;

                breaker.innerHTML = `
                    <div class="label">${mod}</div>
                    <div class="switch">
                        <div class="handle"></div>
                    </div>
                    <div class="status">ACTIVE</div>
                `;

                breaker.onclick = () => {
                    breaker.classList.toggle('tripped');
                    const status = breaker.querySelector('.status');
                    status.innerText = breaker.classList.contains('tripped') ? 'TRIPPED' : 'ACTIVE';
                };

                grid.appendChild(breaker);
            });
        }

        // Randomly trip breakers for effect
        setInterval(() => {
            if (Math.random() > 0.95) {
                const idx = Math.floor(Math.random() * modules.length);
                const b = grid.children[idx];
                if (!b.classList.contains('tripped')) {
                    b.click();
                    setTimeout(() => b.click(), 2000);
                }
            }
        }, 3000);

        init();
    </script>
</body>
</html>
