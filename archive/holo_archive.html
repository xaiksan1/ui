<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ADAM Holographic Archive</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a001a;
            color: #bf00ff;
            font-family: 'Courier New', Courier, monospace;
            perspective: 1000px;
        }
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 0 0 10px #bf00ff;
            z-index: 100;
        }
        .scene {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }
        .carousel {
            width: 200px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
        }
        .crystal {
            position: absolute;
            width: 100px;
            height: 150px;
            background: rgba(191, 0, 255, 0.2);
            border: 1px solid #bf00ff;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            backface-visibility: visible;
            cursor: pointer;
            transition: transform 0.5s;
        }
        .crystal:hover {
            background: rgba(191, 0, 255, 0.4);
            transform: scale(1.2);
        }
        @keyframes rotate {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        .details {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            border: 1px solid #bf00ff;
            padding: 10px;
            background: rgba(191, 0, 255, 0.05);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>HOLO_ARCHIVE_v6.4</h1>
        <p>MEMORY_INDEX: 8.4 PB</p>
    </div>
    <div class="scene">
        <div class="carousel" id="carousel">
            <!-- Crystals will be added here -->
        </div>
    </div>
    <div class="details" id="details">
        SELECT_CRYSTAL_FOR_METADATA
    </div>

    <script>
        const carousel = document.getElementById('carousel');
        const details = document.getElementById('details');
        const crystalCount = 8;
        const radius = 300;

        const archiveData = [
            { id: 'MEM-001', type: 'CORE_LOGIC', date: '2025-01-10' },
            { id: 'MEM-002', type: 'NEURAL_WEIGHTS', date: '2025-02-15' },
            { id: 'MEM-003', type: 'USER_INTERACTION', date: '2025-03-20' },
            { id: 'MEM-004', type: 'SECURITY_THREATS', date: '2025-04-05' },
            { id: 'MEM-005', type: 'CREATIVE_OUTPUT', date: '2025-05-12' },
            { id: 'MEM-006', type: 'SYSTEM_METRICS', date: '2025-06-30' },
            { id: 'MEM-007', type: 'EXTERNAL_API', date: '2025-07-18' },
            { id: 'MEM-008', type: 'QUANTUM_STATE', date: '2025-08-22' }
        ];

        function init() {
            for (let i = 0; i < crystalCount; i++) {
                const crystal = document.createElement('div');
                crystal.className = 'crystal';
                const angle = (i / crystalCount) * 360;
                crystal.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
                
                const data = archiveData[i];
                crystal.innerHTML = `
                    <strong>${data.id}</strong>
                    <span>${data.type}</span>
                `;

                crystal.addEventListener('mouseenter', () => {
                    details.innerHTML = `
                        ID: ${data.id}<br>
                        TYPE: ${data.type}<br>
                        TIMESTAMP: ${data.date}<br>
                        STATUS: ARCHIVED_ENCRYPTED
                    `;
                });

                carousel.appendChild(crystal);
            }
        }

        init();
    </script>
</body>
</html>
