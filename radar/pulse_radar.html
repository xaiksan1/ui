<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ADAM v6.4 - Pulse Radar</title>
    <style>
        :root {
            --radar-green: #00ff41;
            --radar-bg: #001100;
            --radar-glow: rgba(0, 255, 65, 0.3);
        }

        body {
            margin: 0;
            background: var(--radar-bg);
            color: var(--radar-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #radar-container {
            position: relative;
            width: 600px;
            height: 600px;
            border: 2px solid var(--radar-green);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--radar-glow);
        }

        .grid-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0, 255, 65, 0.1);
            border-radius: 50%;
        }

        .sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: conic-gradient(from 0deg, var(--radar-green) 0deg, transparent 90deg);
            transform-origin: top left;
            border-radius: 0 0 300px 0;
            opacity: 0.3;
        }

        .blip {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--radar-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--radar-green);
            opacity: 0;
            transition: opacity 2s ease-out;
        }

        .blip.active {
            opacity: 1;
        }

        .ui-text {
            position: absolute;
            font-size: 12px;
            text-transform: uppercase;
        }

        #coords { bottom: 20px; left: 20px; }
        #status { top: 20px; right: 20px; }
        #title { top: 20px; left: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="radar-container">
        <div class="sweep" id="sweep"></div>
        <div class="grid-circle" style="width: 200px; height: 200px;"></div>
        <div class="grid-circle" style="width: 400px; height: 400px;"></div>
        <div class="grid-circle" style="width: 600px; height: 600px;"></div>
        
        <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,255,65,0.1);"></div>
        <div style="position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: rgba(0,255,65,0.1);"></div>

        <div id="blips-container"></div>

        <div class="ui-text" id="title">PULSE_RADAR_v6.4</div>
        <div class="ui-text" id="status">SCANNING...</div>
        <div class="ui-text" id="coords">AZIMUTH: 000° | RANGE: 0.0km</div>
    </div>

    <script>
        const sweep = document.getElementById('sweep');
        const blipsContainer = document.getElementById('blips-container');
        const coords = document.getElementById('coords');
        
        let angle = 0;
        const blips = [];

        // Create random blips
        for(let i=0; i<10; i++) {
            const b = document.createElement('div');
            b.className = 'blip';
            const r = 50 + Math.random() * 240;
            const a = Math.random() * Math.PI * 2;
            b.style.left = (300 + r * Math.cos(a)) + 'px';
            b.style.top = (300 + r * Math.sin(a)) + 'px';
            blipsContainer.appendChild(b);
            blips.push({ element: b, angle: a * (180/Math.PI), radius: r });
        }

        function update() {
            angle = (angle + 2) % 360;
            sweep.style.transform = `rotate(${angle}deg)`;

            blips.forEach(b => {
                // Check if sweep is passing over blip
                const diff = (angle - b.angle + 360) % 360;
                if(diff < 5) {
                    b.element.classList.add('active');
                    // Update coords when sweep hits a blip
                    coords.innerText = `AZIMUTH: ${Math.floor(b.angle).toString().padStart(3, '0')}° | RANGE: ${(b.radius/10).toFixed(1)}km`;
                } else if (diff > 10) {
                    b.element.classList.remove('active');
                }
            });

            requestAnimationFrame(update);
        }

        update();

        // Randomly move blips
        setInterval(() => {
            const b = blips[Math.floor(Math.random() * blips.length)];
            b.angle = (b.angle + (Math.random() - 0.5) * 10 + 360) % 360;
            const r = Math.max(50, Math.min(290, b.radius + (Math.random() - 0.5) * 20));
            b.radius = r;
            const rad = b.angle * (Math.PI/180);
            b.element.style.left = (300 + r * Math.cos(rad)) + 'px';
            b.element.style.top = (300 + r * Math.sin(rad)) + 'px';
        }, 3000);

    </script>
</body>
</html>
