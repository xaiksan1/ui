<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ADAM Weather Predictor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            color: #888;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 0 0 5px #fff;
            z-index: 10;
        }
        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>WEATHER_PREDICTOR_v6.4</h1>
        <p>MODEL: CHAOS_THEORY_v4</p>
    </div>
    <div class="stats" id="stats">
        PRESSURE: 1013 hPa<br>
        HUMIDITY: 45%<br>
        WIND_SPEED: 12 km/h
    </div>
    <canvas id="weatherCanvas"></canvas>

    <script>
        const canvas = document.getElementById('weatherCanvas');
        const ctx = canvas.getContext('2d');
        const stats = document.getElementById('stats');

        let width, height;
        let particles = [];
        const particleCount = 500;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.life = Math.random() * 100 + 100;
                this.color = Math.random() > 0.5 ? '#fff' : '#555';
            }

            update() {
                // Simple flow field based on noise-like function
                const angle = (Math.sin(this.x * 0.01) + Math.cos(this.y * 0.01)) * Math.PI;
                this.vx += Math.cos(angle) * 0.1;
                this.vy += Math.sin(angle) * 0.1;
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.vx *= 0.95;
                this.vy *= 0.95;
                
                this.life--;
                if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 5, this.y - this.vy * 5);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.life / 200;
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        function init() {
            resize();
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(17, 17, 17, 0.1)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            if (Math.random() > 0.99) {
                stats.innerHTML = `PRESSURE: ${1000 + Math.floor(Math.random() * 30)} hPa<br>HUMIDITY: ${Math.floor(Math.random() * 100)}%<br>WIND_SPEED: ${Math.floor(Math.random() * 50)} km/h`;
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        animate();
    </script>
</body>
</html>
