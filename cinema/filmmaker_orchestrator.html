<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAM Filmmaker Orchestrator - Cinematic AI 🎬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <!-- Three.js via CDN pour assurer la compatibilité immédiate -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root { --gold: #d4af37; --bg: #050505; --panel: rgba(15, 15, 15, 0.9); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: white; overflow: hidden; }
        .mono { font-family: 'Fira Code', monospace; }
        .viewport-container { position: absolute; inset: 0; z-index: 0; }
        .overlay-ui { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-direction: column; justify-content: justify-between; padding: 2rem; }
        .interactive { pointer-events: auto; }
        .glass-panel { background: var(--panel); border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(20px); border-radius: 1rem; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .timeline-track { height: 4px; background: rgba(255,255,255,0.1); position: relative; border-radius: 2px; }
        .timeline-handle { width: 12px; height: 12px; background: var(--gold); border-radius: 50%; position: absolute; top: -4px; cursor: pointer; box-shadow: 0 0 10px var(--gold); }
        
        @keyframes pulse-gold { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .rec-dot { width: 8px; height: 8px; background: #ff0000; border-radius: 50%; animation: pulse-gold 1s infinite; }
    </style>
</head>
<body>

    <!-- Viewport 3D -->
    <div id="viewport" class="viewport-container"></div>

    <!-- UI Overlay -->
    <div class="overlay-ui">
        <!-- Header -->
        <header class="flex justify-between items-start interactive">
            <div class="space-y-1">
                <div class="flex items-center gap-3">
                    <div class="rec-dot"></div>
                    <h1 class="text-2xl font-black uppercase tracking-tighter italic">Filmmaker<span class="text-gold-500 text-[#d4af37]">Orchestrator</span></h1>
                </div>
                <p class="text-[10px] mono opacity-50 tracking-[0.3em]">> ADAM CINEMATIC ENGINE v1.0</p>
            </div>
            <div class="glass-panel px-4 py-2 flex gap-6 text-[10px] mono uppercase font-bold">
                <div class="text-gold-500 text-[#d4af37]">FPS: <span id="fps-counter">60</span></div>
                <div>RES: 4K_ULTRA</div>
                <div>CAM: FREE_ORBIT</div>
            </div>
        </header>

        <!-- Main Content Area (Empty for 3D) -->
        <div class="flex-1"></div>

        <!-- Bottom Controls -->
        <div class="space-y-4 interactive">
            <!-- Timeline -->
            <div class="glass-panel p-4 space-y-3">
                <div class="flex justify-between text-[9px] mono opacity-50 uppercase">
                    <span>00:00:00</span>
                    <span class="text-gold-500 text-[#d4af37]">Sequence_01: The Awakening</span>
                    <span>00:02:45</span>
                </div>
                <div class="timeline-track">
                    <div id="timeline-progress" class="absolute h-full bg-[#d4af37] w-1/3 rounded-l-2px"></div>
                    <div class="timeline-handle" style="left: 33%"></div>
                </div>
            </div>

            <!-- Director Panel -->
            <div class="grid grid-cols-12 gap-4">
                <!-- Oracle Director Chat -->
                <div class="col-span-8 glass-panel p-4 flex flex-col gap-3">
                    <div id="director-logs" class="flex-1 h-24 overflow-y-auto space-y-2 text-[11px] mono">
                        <div class="text-white/40 italic">[SYSTEM] Moteur de rendu initialisé. En attente des instructions du réalisateur.</div>
                        <div class="text-[#d4af37] font-bold">ADAM: "Quelle vision allons-nous manifester aujourd'hui ?"</div>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="director-input" class="flex-1 bg-black/50 border border-white/10 rounded-lg px-4 py-2 text-xs outline-none focus:border-[#d4af37]" placeholder="Décrivez la scène (ex: 'Nuit pluvieuse, néons bleus, travelling lent')...">
                        <button onclick="sendToDirector()" class="bg-[#d4af37] text-black font-black px-6 py-2 rounded-lg text-[10px] uppercase hover:bg-white transition-all">Action 🎬</button>
                    </div>
                </div>

                <!-- Scene Settings -->
                <div class="col-span-4 glass-panel p-4 grid grid-cols-2 gap-2">
                    <button onclick="togglePostProcess()" class="border border-white/10 rounded-lg p-2 text-[9px] uppercase font-bold hover:bg-white/5">Post-Process</button>
                    <button onclick="resetCamera()" class="border border-white/10 rounded-lg p-2 text-[9px] uppercase font-bold hover:bg-white/5">Reset Cam</button>
                    <button onclick="addActor()" class="border border-white/10 rounded-lg p-2 text-[9px] uppercase font-bold hover:bg-white/5">Add Actor</button>
                    <button onclick="exportScene()" class="bg-white/10 rounded-lg p-2 text-[9px] uppercase font-bold hover:bg-white/20">Export JSON</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, cube;
        const directorLogs = document.getElementById('director-logs');

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x050505, 0.1);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('viewport').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xd4af37, 100);
            pointLight.position.set(2, 3, 4);
            scene.add(pointLight);

            // Initial Object (The "Actor")
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xd4af37, 
                metalness: 0.8, 
                roughness: 0.2,
                wireframe: false 
            });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            // Grid Helper
            const grid = new THREE.GridHelper(20, 20, 0x333333, 0x111111);
            scene.add(grid);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Director Logic
        window.sendToDirector = async () => {
            const input = document.getElementById('director-input');
            const text = input.value;
            if (!text) return;

            addLog(`Réalisateur: "${text}"`, 'user');
            input.value = '';

            // Simulation de l'IA ADAM
            addLog(`ADAM: "Analyse de la vision... Application des paramètres cinématiques."`, 'ai');
            
            // Effet visuel simple pour la démo
            if(text.toLowerCase().includes('rouge')) cube.material.color.set(0xff0000);
            if(text.toLowerCase().includes('bleu')) cube.material.color.set(0x0000ff);
            if(text.toLowerCase().includes('wireframe')) cube.material.wireframe = !cube.material.wireframe;
        };

        function addLog(msg, type) {
            const div = document.createElement('div');
            div.className = type === 'ai' ? 'text-[#d4af37] font-bold' : 'text-white/70';
            div.innerText = msg;
            directorLogs.appendChild(div);
            directorLogs.scrollTop = directorLogs.scrollHeight;
        }

        init();
    </script>
</body>
</html>
