<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAM - Quantum Entanglement Dashboard</title>
    <style>
        body { margin: 0; background: #050505; color: #00d4ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #container { display: flex; height: 100vh; }
        #sidebar { width: 300px; border-right: 1px solid #00d4ff; padding: 20px; background: rgba(0, 20, 40, 0.5); }
        #main { flex: 1; position: relative; }
        .node-list { list-style: none; padding: 0; }
        .node-item { 
            padding: 10px; 
            border: 1px solid #00d4ff; 
            margin-bottom: 10px; 
            cursor: pointer;
            transition: 0.3s;
        }
        .node-item:hover { background: rgba(0, 212, 255, 0.2); }
        .node-item.active { background: #00d4ff; color: #000; }
        canvas { width: 100%; height: 100%; }
        .overlay-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.5;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00;
            margin-right: 10px;
            box-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h2>QUANTUM NODES</h2>
            <ul class="node-list">
                <li class="node-item active"><span class="status-indicator"></span>NODE_ALPHA_01</li>
                <li class="node-item"><span class="status-indicator"></span>NODE_BETA_02</li>
                <li class="node-item"><span class="status-indicator"></span>NODE_GAMMA_03</li>
                <li class="node-item"><span class="status-indicator" style="background: #ff0000; box-shadow: 0 0 10px #ff0000;"></span>NODE_DELTA_04</li>
            </ul>
            <div style="margin-top: 50px;">
                <h3>ENTANGLEMENT RATIO</h3>
                <div style="font-size: 48px;">0.982</div>
                <p>Coherence maintained across 4 dimensions.</p>
            </div>
        </div>
        <div id="main">
            <canvas id="quantumCanvas"></canvas>
            <div class="overlay-text">Entanglement Dashboard v1.0</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('quantumCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 2 + 1;
                // Entangled pair
                this.pair = null;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00d4ff';
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }

        // Entangle them in pairs
        for (let i = 0; i < particles.length; i += 2) {
            if (particles[i+1]) {
                particles[i].pair = particles[i+1];
                particles[i+1].pair = particles[i];
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();

                if (p.pair) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.pair.x, p.pair.y);
                    const dist = Math.hypot(p.x - p.pair.x, p.y - p.pair.y);
                    const opacity = Math.max(0, 1 - dist / 300);
                    ctx.strokeStyle = `rgba(0, 212, 255, ${opacity * 0.5})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
