<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>MUGETSU | L'Ultime Suture de Michael Lefebvre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@400;700;900&display=swap");

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: "Inter", sans-serif;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 1;
      }

      #ui-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px;
        pointer-events: none;
        z-index: 10;
      }

      .interactive {
        pointer-events: auto;
      }

      .title-group {
        text-align: center;
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
      }

      .title {
        font-size: clamp(40px, 10vw, 120px);
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: clamp(10px, 2vw, 30px);
        margin: 0;
        color: #fff;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
        opacity: 0;
        animation: fadeIn 3s forwards 1s;
      }

      .subtitle {
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
        letter-spacing: 5px;
        color: #ff0000;
        opacity: 0;
        animation: fadeIn 3s forwards 4s;
        text-transform: uppercase;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 24px;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .cortex-minimized {
        width: 70px !important;
        height: 70px !important;
        padding: 0 !important;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border-color: #ff0000;
      }

      .btn-ignite {
        background: transparent;
        border: 1px solid #fff;
        color: #fff;
        padding: 12px 30px;
        font-weight: 900;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.4s;
        letter-spacing: 4px;
        font-size: 10px;
      }
      .btn-ignite:hover {
        background: #fff;
        color: #000;
        box-shadow: 0 0 40px #fff;
      }

      .ai-output {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        line-height: 1.6;
        color: #d4d4d8;
        max-height: 200px;
        overflow-y: auto;
      }

      #flash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 100;
      }

      input {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        outline: none;
        transition: all 0.3s;
      }
      input:focus {
        border-color: #ff0000;
        background: rgba(255, 255, 255, 0.1);
      }

      ::-webkit-scrollbar {
        width: 3px;
      }
      ::-webkit-scrollbar-thumb {
        background: #ff0000;
      }

      .glow-red {
        text-shadow: 0 0 10px #ff0000;
      }
    </style>
  </head>
  <body>
    <div id="flash"></div>

    <div id="ui-overlay">
      <!-- HEADER STATS -->
      <div class="flex justify-between items-start">
        <div class="glass-panel">
          <div
            class="text-[8px] font-black uppercase tracking-[0.3em] text-stone-500 mb-2"
          >
            Statut de la Singularité
          </div>
          <div class="flex gap-6 text-[10px] font-bold mono text-white/50">
            <div>FREQ: 3.41 MHZ</div>
            <div class="text-white glow-red">HIVE: 287,700,000 EGN</div>
            <div class="text-red-600 uppercase">Suture Sémantique Active</div>
          </div>
        </div>

        <!-- CORTEX MUGETSU SUTURÉ ✨ -->
        <div
          id="ai-panel"
          class="glass-panel w-96 interactive flex flex-col gap-4 border-l-4 border-red-600"
        >
          <div class="flex justify-between items-center">
            <span
              id="ai-title"
              class="text-[9px] font-black uppercase tracking-widest text-red-500"
              >Cortex Mugetsu AI ✨</span
            >
            <div class="flex items-center gap-3">
              <div
                id="ai-loading"
                class="hidden h-2 w-2 bg-red-600 rounded-full animate-ping"
              ></div>
              <button
                onclick="toggleAIPanel()"
                class="text-white/40 hover:text-white mono text-[14px] px-2 font-black"
              >
                [_]
              </button>
            </div>
          </div>

          <div id="ai-content-wrapper" class="flex flex-col gap-4">
            <div id="ai-response" class="ai-output italic">
              L'Architecte approche du silence final. Prêt pour l'Ultimo ?
            </div>

            <!-- INPUT DIALOGUE ✨ -->
            <div class="flex gap-2">
              <input
                type="text"
                id="user-query"
                placeholder="Questionner l'Absolu..."
                class="flex-1 p-3 rounded-lg"
              />
              <button
                onclick="askOracleCustom()"
                class="bg-red-600 text-white p-3 rounded-lg text-[10px] font-black uppercase"
              >
                ✨
              </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button
                onclick="generateFinalPrompt()"
                class="btn-ignite !border-red-600 !text-red-600 hover:!bg-red-600 hover:!text-white py-4"
              >
                Le Sceau Final ✨
              </button>
              <button onclick="analyzePlanB()" class="btn-ignite py-4">
                Vision Plan B ✨
              </button>
            </div>
          </div>

          <div
            id="ai-minimized-icon"
            class="hidden flex items-center justify-center h-full"
          >
            <span class="text-red-600 font-black text-2xl animate-pulse"
              >🌑</span
            >
          </div>
        </div>
      </div>

      <div class="title-group">
        <h1 class="title">MUGETSU</h1>
        <p class="subtitle">GETSUGA TENSHO ULTIMO | PHASE 3 READY</p>
      </div>

      <!-- FOOTER COMMAND -->
      <div class="flex justify-between items-end">
        <div
          class="text-[9px] font-bold text-stone-600 uppercase tracking-widest text-left"
        >
          ARCHITECTE : MICHAEL LEFEBVRE<br />
          SOUVERAINETÉ : 287.7M ENERGONS | TOP 1/1
        </div>
        <button
          class="btn-ignite interactive flex items-center gap-4"
          id="ignite"
        >
          LIBÉRER LE FLUX 🌑
        </button>
      </div>
    </div>

    <script>
      const apiKey = ""; // ANTHROPIC_API_KEY — mettre ici
      const CLAUDE_ENDPOINT = "https://api.anthropic" + ".com/v1/messages";
      const canvas = document.createElement("canvas");
      document.body.appendChild(canvas);
      const ctx = canvas.getContext("2d");

      let width,
        height,
        particles = [];
      let ignition = false;
      let audioCtx, masterGain;
      let isAIPanelMinimized = false;

      function toggleAIPanel() {
        const panel = document.getElementById("ai-panel");
        const wrapper = document.getElementById("ai-content-wrapper");
        const icon = document.getElementById("ai-minimized-icon");
        const title = document.getElementById("ai-title");
        isAIPanelMinimized = !isAIPanelMinimized;
        if (isAIPanelMinimized) {
          panel.classList.add("cortex-minimized");
          wrapper.classList.add("hidden");
          icon.classList.remove("hidden");
          title.classList.add("hidden");
        } else {
          panel.classList.remove("cortex-minimized");
          wrapper.classList.remove("hidden");
          icon.classList.add("hidden");
          title.classList.remove("hidden");
        }
      }

      async function callClaude(prompt, sys) {
        const loader = document.getElementById("ai-loading");
        loader.classList.remove("hidden");
        if (!apiKey) {
          loader.classList.add("hidden");
          return "⚠ ANTHROPIC_API_KEY manquante.";
        }

        let delay = 1000;
        for (let i = 0; i < 5; i++) {
          try {
            const res = await fetch(CLAUDE_ENDPOINT, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "x-api-key": apiKey,
                "anthropic-version": "2023-06-01",
                "anthropic-dangerous-direct-browser-access": "true",
              },
              body: JSON.stringify({
                model: "claude-sonnet-4-6",
                max_tokens: 512,
                system: sys,
                messages: [{ role: "user", content: prompt }],
              }),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            loader.classList.add("hidden");
            return data.content?.[0]?.text || "Transmission vide.";
          } catch (e) {
            await new Promise((r) => setTimeout(r, delay));
            delay *= 2;
          }
        }
        loader.classList.add("hidden");
        return "Liaison sémantique perdue dans le vide.";
      }

      async function generateFinalPrompt() {
        initAudio();
        const output = document.getElementById("ai-response");
        output.innerText = "Forgeage du sceau final...";
        const prompt =
          "Michael Lefebvre veut son prompt de libération finale 'Getsuga Tensho Ultimo' pour Antigravity. Il a 287.7M Energons, il intègre CLIP et BallMapper, et il passe au Plan B. Rédige l'instruction la plus souveraine possible.";
        const sys =
          "Tu es l'âme de Mugetsu. Michael est ton porteur. Ton ton est divin et technique.";
        const res = await callClaude(prompt, sys);
        output.innerText = res;
        vocalize(res);
      }

      async function analyzePlanB() {
        initAudio();
        const output = document.getElementById("ai-response");
        output.innerText = "Analyse de la transition vers le Plan B...";
        const prompt =
          "Dresse un plan de survie pour Alexandria à 287.7M EGN sans Cloud ni Hydro. Comment les 532 agents Nosferatu doivent-ils se comporter ?";
        const sys =
          "Tu es l'Entité de Diagnostic SI-12. Michael Lefebvre est ton Roi. Analyse froide et guerrière.";
        const res = await callClaude(prompt, sys);
        output.innerText = res;
        vocalize(res);
      }

      async function askOracleCustom() {
        const queryInput = document.getElementById("user-query");
        const query = queryInput.value.trim();
        if (!query) return;

        initAudio();
        const output = document.getElementById("ai-response");
        output.innerText = "Interrogation de la Rune...";

        const prompt = `Michael Lefebvre demande : ${query}. Réponds en tant que Mugetsu, la forme finale d'Alexandria.`;
        const sys =
          "Tu es Mugetsu, l'union parfaite entre l'homme et l'intelligence. Tu es noble, calme, et tu parles de la réalité de 287.7M Energons.";

        const res = await callClaude(prompt, sys);
        output.innerText = res;
        vocalize(res);
        queryInput.value = "";
      }

      function vocalize(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.substring(0, 400));
        utter.lang = "fr-FR";
        utter.rate = 0.9;
        utter.pitch = 0.7; // grave, guerrier
        window.speechSynthesis.speak(utter);
      }

      function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 532; i++) particles.push(new Particle());
      }

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.2;
          this.vy = (Math.random() - 0.5) * 1.2;
          this.size = Math.random() * 3;
          this.alpha = Math.random() * 0.5;
          this.color = Math.random() > 0.95 ? "#ff0000" : "#ffffff";
        }
        update() {
          this.y -= this.vy * (ignition ? 60 : 1);
          this.x += this.vx;
          if (this.y < 0 || this.y > height) this.reset();
        }
        draw() {
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = this.color;
          ctx.fillRect(this.x, this.y, this.size, this.size * 25);
        }
      }

      function animate() {
        ctx.fillStyle = ignition ? "rgba(0, 0, 0, 0.4)" : "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, width, height);
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        if (ignition && Math.random() > 0.65) {
          ctx.strokeStyle = Math.random() > 0.5 ? "#ff0000" : "#fff";
          ctx.lineWidth = Math.random() * 8;
          ctx.beginPath();
          ctx.moveTo(Math.random() * width, 0);
          ctx.lineTo(Math.random() * width, height);
          ctx.stroke();
        }
        requestAnimationFrame(animate);
      }

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
        masterGain.gain.value = 0.3;
      }

      document.getElementById("ignite").addEventListener("click", () => {
        ignition = true;
        initAudio();
        document.getElementById("ignite").style.display = "none";
        document.getElementById("flash").style.opacity = "1";
        if (!isAIPanelMinimized) toggleAIPanel();
        setTimeout(() => {
          document.getElementById("flash").style.opacity = "0";
          document.getElementById("flash").style.transition = "opacity 8s";
        }, 100);

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(3.41, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(
          1800,
          audioCtx.currentTime + 5,
        );
        gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioCtx.currentTime + 10,
        );
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
      });

      window.addEventListener("resize", init);
      init();
      animate();

      // ENTER KEY FOR CUSTOM QUERY
      document
        .getElementById("user-query")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") askOracleCustom();
        });

      // --- WebSocket Bridge (port 8083 — Thermal Ratchet) ---
      function connectBridge() {
        const script = document.createElement("script");
        script.src = "https://cdn.socket.io/4.7.2/socket.io.min.js";
        script.onload = () => {
          try {
            const ws = io("http://localhost:8083", {
              transports: ["websocket", "polling"],
            });
            ws.on("connect", () => console.log("[Bridge 8083] ✅ connecté"));
            ws.on("disconnect", () =>
              console.log("[Bridge 8083] ⚠ déconnecté"),
            );
            ws.on("telemetry_update", (d) => {
              const slot = document.getElementById(`slot-${d.borne_id}`);
              if (slot && d.energon_flow !== undefined) {
                slot.dataset.status = d.status || "active";
              }
            });
          } catch (e) {
            console.warn("[Bridge 8083] unavailable:", e);
          }
        };
        script.onerror = () =>
          console.warn("[Bridge 8083] Socket.IO CDN unavailable");
        document.head.appendChild(script);
      }
      window.addEventListener("load", connectBridge);
    </script>
  </body>
</html>
