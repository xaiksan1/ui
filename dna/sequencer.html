<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ADAM v6.4 - DNA Sequencer</title>
    <style>
        :root {
            --dna-teal: #00ffd2;
            --dna-bg: #000a0a;
            --dna-accent: #008b8b;
        }

        body {
            margin: 0;
            background: var(--dna-bg);
            color: var(--dna-teal);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
        }

        #dna-canvas {
            width: 60%;
            height: 100vh;
        }

        .sidebar {
            width: 40%;
            height: 100vh;
            border-left: 1px solid var(--dna-teal);
            background: rgba(0, 255, 210, 0.05);
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .code-stream {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.2;
            color: var(--dna-accent);
        }

        .mutation-alert {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 10px;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header {
            border-bottom: 2px solid var(--dna-teal);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <canvas id="dna-canvas"></canvas>

    <div class="sidebar">
        <div class="header">
            <h2 style="margin:0;">GENETIC_SEQUENCER_v6.4</h2>
            <div style="font-size: 12px;">MODULE_ID: ADAM-CORE-ANIMA</div>
        </div>

        <div id="alerts"></div>

        <div class="code-stream" id="code-stream">
            <!-- Code stream generated by JS -->
        </div>
    </div>

    <script>
        const canvas = document.getElementById('dna-canvas');
        const ctx = canvas.getContext('2d');
        const codeStream = document.getElementById('code-stream');
        const alerts = document.getElementById('alerts');

        let width, height;
        let angle = 0;

        function resize() {
            width = canvas.width = canvas.clientWidth;
            height = canvas.height = canvas.clientHeight;
        }

        function drawDNA() {
            ctx.clearRect(0, 0, width, height);
            
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = 80;
            const speed = 0.02;
            const points = 30;

            for (let i = 0; i < points; i++) {
                const y = (height / points) * i;
                const a = angle + (i * 0.5);
                
                const x1 = centerX + Math.cos(a) * radius;
                const x2 = centerX + Math.cos(a + Math.PI) * radius;

                // Draw connecting line
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.strokeStyle = 'rgba(0, 255, 210, 0.3)';
                ctx.stroke();

                // Draw nodes
                ctx.beginPath();
                ctx.arc(x1, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = var(--dna-teal);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x2, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = var(--dna-accent);
                ctx.fill();
            }

            angle += speed;
        }

        function updateCodeStream() {
            const tokens = ['MCP', 'JSB', 'PY', 'DT', 'ANM', 'V64', 'SYN', 'LNK'];
            let line = '';
            for(let i=0; i<8; i++) {
                line += tokens[Math.floor(Math.random() * tokens.length)] + ' ';
            }
            const div = document.createElement('div');
            div.innerText = line;
            codeStream.prepend(div);
            if(codeStream.childNodes.length > 50) codeStream.lastChild.remove();

            if(Math.random() > 0.98) {
                const alert = document.createElement('div');
                alert.className = 'mutation-alert';
                alert.innerText = "CRITICAL MUTATION DETECTED AT SEQUENCE " + Math.floor(Math.random() * 10000);
                alerts.prepend(alert);
                setTimeout(() => alert.remove(), 5000);
            }
        }

        function animate() {
            drawDNA();
            requestAnimationFrame(animate);
        }

        setInterval(updateCodeStream, 200);
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
