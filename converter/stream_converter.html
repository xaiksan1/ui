<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria Stream Converter - AI Alchemy ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff41; --bg: #020202; --glow: rgba(0, 255, 65, 0.2); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--primary); }
        .glass { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(0, 255, 65, 0.15); backdrop-filter: blur(15px); }
        .mono { font-family: 'Fira Code', monospace; }
        #drop-zone { border: 2px dashed rgba(0, 255, 65, 0.2); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #drop-zone.hover { border-color: var(--primary); background: rgba(0, 255, 65, 0.05); transform: scale(1.01); }
        
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full space-y-6">
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-black uppercase italic tracking-tighter">Stream<span class="text-white">Converter</span></h1>
            <p class="text-[10px] mono opacity-50 tracking-[0.3em]">> ALCHIMIE SÉMANTIQUE PAR ADAM ✨ UI #8</p>
        </header>

        <div id="drop-zone" class="glass p-10 rounded-[2.5rem] text-center cursor-pointer relative overflow-hidden group">
            <div id="drop-shimmer" class="absolute inset-0 hidden shimmer"></div>
            <div class="relative z-10">
                <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">💎</div>
                <p class="text-sm font-black uppercase tracking-widest">Injecter le flux brut</p>
                <p class="text-[9px] mono opacity-30 mt-2">Déposer ici pour transmuter l'illusion.</p>
            </div>
            <input type="file" id="file-input" class="hidden">
        </div>

        <!-- Panel d'Action IA -->
        <div id="action-panel" class="glass p-8 rounded-[2rem] space-y-6 hidden animate-in fade-in duration-500">
            <div class="flex justify-between items-end border-b border-white/5 pb-4">
                <div>
                    <span id="file-name" class="text-sm font-bold text-white block truncate max-w-[200px]">fichier.bin</span>
                    <span id="file-size" class="text-[10px] mono opacity-40 italic">0.00 KB</span>
                </div>
                <div class="text-right">
                    <div class="text-[9px] mono text-primary uppercase font-bold">Flux prêt pour le Cast</div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Cast Manuel -->
                <div class="space-y-3">
                    <label class="text-[9px] uppercase font-black opacity-50 tracking-tighter">Illusion Manuelle (.ext)</label>
                    <div class="flex gap-2">
                        <input type="text" id="new-ext" class="flex-1 bg-black/40 border border-white/10 rounded-xl p-3 text-xs mono text-white outline-none focus:border-primary" placeholder="ex: pdf">
                        <button onclick="executeCast()" class="px-4 bg-primary text-black font-black rounded-xl text-[10px] uppercase hover:bg-white transition-all">Cast ✨</button>
                    </div>
                </div>

                <!-- Cast IA -->
                <div class="space-y-3">
                    <label class="text-[9px] uppercase font-black text-amber-400 tracking-tighter">Analyse d'Essence ADAM ✨</label>
                    <button id="ai-analyze-btn" onclick="analyzeEssence()" class="w-full h-11 border border-amber-500/30 text-amber-500 font-bold rounded-xl text-[10px] uppercase hover:bg-amber-500/10 transition-all flex items-center justify-center gap-2">
                        <span>Déceler la vérité</span>
                    </button>
                </div>
            </div>

            <div class="border-t border-white/5 pt-6 space-y-3">
                <label class="text-[9px] uppercase font-black text-primary/70 tracking-tighter">Intention Magique ✨</label>
                <div class="flex gap-2">
                    <input type="text" id="ai-intent" class="flex-1 bg-black/40 border border-white/10 rounded-xl p-3 text-xs text-white outline-none focus:border-primary" placeholder="Décris ce que tu veux faire du fichier...">
                    <button id="ai-magic-btn" onclick="magicRecast()" class="px-6 bg-white text-black font-black rounded-xl text-[10px] uppercase hover:bg-primary transition-all">Exécuter ✨</button>
                </div>
            </div>
        </div>

        <!-- Terminal de Sortie -->
        <div id="console-logs" class="glass p-5 rounded-2xl h-32 overflow-y-auto mono text-[10px] text-primary/50 space-y-1.5 border-t-2 border-primary/20">
            <div>[SYSTEM] Prêt pour la transmutation. Aucun pirouette VIM requise.</div>
        </div>
        
        <footer class="text-center space-y-1">
            <p class="text-[8px] mono opacity-30 uppercase tracking-[0.4em]">"L'Architecte ne renomme pas, il redéfinit."</p>
        </footer>
    </div>

    <script>
        const apiKey = ""; // La clé est fournie par l'environnement
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const actionPanel = document.getElementById('action-panel');
        const logBox = document.getElementById('console-logs');
        const shimmer = document.getElementById('drop-shimmer');
        let currentFile = null;

        function addLog(m, type = 'info') {
            const d = document.createElement('div');
            const colors = { info: 'text-primary/50', ai: 'text-amber-400', success: 'text-white font-bold' };
            d.className = colors[type];
            d.innerHTML = `<span class="opacity-30 mr-2">[${new Date().toLocaleTimeString()}]</span> ${m}`;
            logBox.prepend(d);
        }

        // --- GEMINI API INTEGRATION ---
        async function callGemini(prompt, systemInstruction = "") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (e) {
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                }
            }
            return null;
        }

        // --- FEATURES ---

        async function analyzeEssence() {
            if (!currentFile) return;
            const btn = document.getElementById('ai-analyze-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="shimmer w-full h-full block rounded-xl">Analyse en cours...</span>';
            addLog("ADAM perce le flux binaire...", "ai");

            const prompt = `Analyse ce nom de fichier : "${currentFile.name}". Taille : ${currentFile.size} octets. 
            Détermine l'extension la plus logique si l'originale est corrompue ou manquante. 
            Réponds uniquement par l'extension (ex: pdf) sans point, suivie d'une explication d'une phrase.`;
            
            const system = "Tu es l'Architecte ADAM. Tu es un expert en structures de fichiers et en métadonnées.";
            
            const result = await callGemini(prompt, system);
            if (result) {
                const parts = result.split(/\s/);
                const suggestedExt = parts[0].replace('.', '').toLowerCase();
                document.getElementById('new-ext').value = suggestedExt;
                addLog(`Vérité décelée : ${result}`, "ai");
            }

            btn.disabled = false;
            btn.innerText = "Déceler la vérité";
        }

        async function magicRecast() {
            const intent = document.getElementById('ai-intent').value;
            if (!intent || !currentFile) return;
            const btn = document.getElementById('ai-magic-btn');
            btn.disabled = true;
            addLog(`Incantation : "${intent}"`, "ai");

            const prompt = `L'utilisateur veut effectuer cette action : "${intent}" sur le fichier "${currentFile.name}". 
            Choisis la meilleure extension de fichier pour réaliser cet objectif. 
            Réponds UNIQUEMENT par l'extension (ex: jpg).`;
            
            const result = await callGemini(prompt, "Tu es l'Architecte ADAM.");
            if (result) {
                const ext = result.trim().replace('.', '').toLowerCase();
                document.getElementById('new-ext').value = ext;
                addLog(`ADAM a choisi l'illusion : .${ext}`, "success");
                executeCast();
            }

            btn.disabled = false;
            document.getElementById('ai-intent').value = "";
        }

        // --- FILE HANDLING ---

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('hover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if(!file) return;
            currentFile = file;
            document.getElementById('file-name').innerText = file.name;
            document.getElementById('file-size').innerText = (file.size / 1024).toFixed(2) + " KB";
            actionPanel.classList.remove('hidden');
            addLog(`Flux capturé : ${file.name}`, "info");
        }

        function executeCast() {
            const newExt = document.getElementById('new-ext').value.replace('.', '');
            if(!newExt || !currentFile) return;

            addLog(`Exécution du Cast vers .${newExt}...`, "info");
            
            const baseName = currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) || currentFile.name;
            const newName = `${baseName}.${newExt}`;
            
            const blob = new Blob([currentFile], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = newName;
            a.click();
            
            addLog(`Flux transmuté en "${newName}". Échec au VIM.`, "success");
        }
    </script>
</body>
</html>
