<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAM - Neural Synapse Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #00ffcc; }
        #canvas-container { width: 100vw; height: 100vh; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffcc;
        }
        .stat-box {
            background: rgba(0, 20, 20, 0.7);
            border: 1px solid #00ffcc;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 20, 20, 0.7);
            border: 1px solid #00ffcc;
            padding: 15px;
            pointer-events: all;
        }
        button {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 10px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: rgba(0, 255, 204, 0.2); }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="overlay">
        <h1 class="pulse">NEURAL SYNAPSE MONITOR v6.4</h1>
        <div class="stat-box">
            <div>ACTIVE NEURONS: <span id="neuron-count">0</span></div>
            <div>SYNAPTIC LOAD: <span id="synapse-load">0%</span></div>
            <div>LATENCY: <span id="latency">12ms</span></div>
        </div>
        <div id="log" style="font-size: 10px; max-height: 200px; overflow: hidden;"></div>
    </div>

    <div id="controls">
        <button onclick="addNeuron()">STIMULATE NEURON</button>
        <button onclick="clearNetwork()">RESET NETWORK</button>
        <button onclick="toggleAuto()">AUTO-EVOLVE</button>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let neurons = [];
        let synapses = [];
        let autoEvolve = true;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x00ffcc, 1, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Initial neurons
            for(let i=0; i<20; i++) addNeuron();

            window.addEventListener('resize', onWindowResize, false);
        }

        function addNeuron() {
            const geometry = new THREE.SphereGeometry(0.5, 16, 16);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x00ffcc, 
                emissive: 0x004444,
                transparent: true,
                opacity: 0.8
            });
            const neuron = new THREE.Mesh(geometry, material);
            
            neuron.position.x = (Math.random() - 0.5) * 60;
            neuron.position.y = (Math.random() - 0.5) * 60;
            neuron.position.z = (Math.random() - 0.5) * 60;
            
            neuron.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.1,
                (Math.random() - 0.5) * 0.1,
                (Math.random() - 0.5) * 0.1
            );

            scene.add(neuron);
            neurons.push(neuron);
            updateStats();
            logMessage(`Neuron ${neurons.length} stimulated at [${neuron.position.x.toFixed(1)}, ${neuron.position.y.toFixed(1)}]`);
        }

        function updateSynapses() {
            // Remove old synapses
            synapses.forEach(s => scene.remove(s));
            synapses = [];

            const material = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.2 });

            for (let i = 0; i < neurons.length; i++) {
                for (let j = i + 1; j < neurons.length; j++) {
                    const dist = neurons[i].position.distanceTo(neurons[j].position);
                    if (dist < 15) {
                        const geometry = new THREE.BufferGeometry().setFromPoints([
                            neurons[i].position,
                            neurons[j].position
                        ]);
                        const line = new THREE.Line(geometry, material);
                        scene.add(line);
                        synapses.push(line);
                    }
                }
            }
        }

        function clearNetwork() {
            neurons.forEach(n => scene.remove(n));
            synapses.forEach(s => scene.remove(s));
            neurons = [];
            synapses = [];
            updateStats();
            logMessage("Network reset.");
        }

        function toggleAuto() {
            autoEvolve = !autoEvolve;
            logMessage(`Auto-evolve: ${autoEvolve ? 'ON' : 'OFF'}`);
        }

        function updateStats() {
            document.getElementById('neuron-count').innerText = neurons.length;
            document.getElementById('synapse-load').innerText = Math.min(100, (synapses.length / 5)).toFixed(1) + '%';
        }

        function logMessage(msg) {
            const log = document.getElementById('log');
            const div = document.createElement('div');
            div.innerText = `> ${msg}`;
            log.prepend(div);
            if (log.childNodes.length > 10) log.removeChild(log.lastChild);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            neurons.forEach(n => {
                n.position.add(n.velocity);
                // Bounce
                if (Math.abs(n.position.x) > 30) n.velocity.x *= -1;
                if (Math.abs(n.position.y) > 30) n.velocity.y *= -1;
                if (Math.abs(n.position.z) > 30) n.velocity.z *= -1;
            });

            if (autoEvolve && Math.random() > 0.98 && neurons.length < 100) {
                addNeuron();
            }

            updateSynapses();
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
